[project]
name = "backend"
version = "1.0.0"
description = "Smart Monitor Backend API"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "apscheduler>=3.10.4",
]

[tool.uv]
package = false

#[build-system]
#requires = ["setuptools>=68.0"]
#build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
